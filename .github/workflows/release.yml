name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/main.js dist/manifest.json dist/styles.css dist/LICENSE --verify-tag --title "Snippet Palette Next $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
